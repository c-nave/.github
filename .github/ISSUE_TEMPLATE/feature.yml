name: ✨ 기능 요청
description: 새 기능이나 개선을 제안합니다
labels: ["type: feature", "P2: normal"]
body:
  - type: markdown
    attributes:
      value: |
        **해결하려는 문제**부터 적어주세요.
        해결책을 먼저 제시하면 더 나은 방법을 검토할 기회를 잃습니다.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 누가, 어떤 상황에서, 무엇이 불편한지 적어주세요.
      placeholder: |
        운영팀이 월간 보고서를 만들 때 조회 결과를 하나씩 복사해 엑셀에 붙여 넣고 있음.
        건수가 많은 달은 이 작업에만 2시간이 걸림.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 구체적인 안이 있다면 적어주세요. 없으면 비워두셔도 됩니다.
      placeholder: 조회 화면에 [CSV 내보내기] 버튼을 추가

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 고려했다가 접은 방법과 그 이유

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫을 수 있는지 체크리스트로 적어주세요.
      placeholder: |
        - [ ] 조회 결과를 CSV 로 내려받을 수 있다
        - [ ] 10,000건까지 30초 이내에 완료된다
        - [ ] 한글이 엑셀에서 깨지지 않는다 (UTF-8 BOM)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 체감 우선순위
      description: 최종 우선순위는 담당자가 조정합니다.
      options:
        - "P3 - 있으면 좋음"
        - "P2 - 불편하지만 우회 가능"
        - "P1 - 핵심 업무가 막힘"
      default: 1
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 참고 자료
      description: 화면 시안, 유사 사례, 관련 문서 링크 등
